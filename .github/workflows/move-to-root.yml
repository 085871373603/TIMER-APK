
name: Move Android Project From Any Folder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project and move to root
        shell: bash
        run: |
          set -e

          echo "Mencari project Android..."

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "Project sudah berada di root."
            exit 0
          fi

          mapfile -t PROJECT_FILES < <(
            find . -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "./.git/*"
          )

          if [ "${#PROJECT_FILES[@]}" -eq 0 ]; then
            echo "ERROR: Project Android tidak ditemukan."
            exit 1
          fi

          if [ "${#PROJECT_FILES[@]}" -gt 1 ]; then
            echo "ERROR: Ditemukan beberapa project Android:"
            printf '%s\n' "${PROJECT_FILES[@]}"
            exit 1
          fi

          PROJECT_DIR=$(dirname "${PROJECT_FILES[0]}")

          echo "Project ditemukan di: $PROJECT_DIR"

          # Salin semua isi, termasuk file tersembunyi
          cp -a "$PROJECT_DIR"/. .

          # Hapus folder pembungkus project
          rm -rf -- "$PROJECT_DIR"

          # Pastikan konfigurasi Gradle tersedia
          test -f settings.gradle -o -f settings.gradle.kts

          echo "Project berhasil dipindahkan."
          echo "Struktur root:"
          ls -la

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Move Android project to repository root"
          git push
