
name: Move Android Project to Root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract all files to root
        shell: bash
        run: |
          set -e

          if [ -d "TIMER_MAXDIS_JAVA_FIXED" ]; then
            SRC="TIMER_MAXDIS_JAVA_FIXED"
          elif [ -d "extracted" ]; then
            SRC="extracted"
          else
            echo "ERROR: Folder sumber tidak ditemukan!"
            exit 1
          fi

          echo "Mengambil seluruh isi dari: $SRC"

          if [ -z "$(find "$SRC" -mindepth 1 -print -quit)" ]; then
            echo "ERROR: Folder sumber kosong!"
            exit 1
          fi

          # Salin seluruh file dan subfolder, termasuk file tersembunyi
          cp -a "$SRC"/. .

          # Hapus folder sumber setelah berhasil disalin
          rm -rf -- "$SRC"

          echo "Isi folder berhasil dipindahkan."

          echo "Struktur root repository:"
          ls -la

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan untuk disimpan."
            exit 0
          fi

          git commit -m "Move all Android project files to root"
          git push
